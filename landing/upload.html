<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Photo to 3D：从照片出发，探索可漫游的三维场景。"><link rel="stylesheet" href="assets/bootstrap.min.css"><link rel="stylesheet" href="assets/fontawesome.min.css"><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><title>Photo to 3D</title></head><body class="mobile "><div class="status"><b>9:41</b><span class="island"></span><span><i class="fa-solid fa-signal" aria-hidden="true"></i> <i class="fa-solid fa-wifi" aria-hidden="true"></i> <i class="fa-solid fa-battery-full" aria-hidden="true"></i></span></div><header class="app-header"><a class="brand" href="home.html"><i class="fa-solid fa-cube" aria-hidden="true"></i> Photo to 3D</a><a class="icon-button" href="settings.html" aria-label="转换服务设置"><i class="fa-solid fa-sliders" aria-hidden="true"></i></a></header><main class="app-content"><span class="eyebrow">CREATE A WORLD</span><h1>从你的照片开始。</h1><p class="muted">选一张清晰的风景照，让空间有一个起点。</p><form id="upload-form"><label class="dropzone" for="photo-input"><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i><b>选择照片</b><span>JPG、PNG 或 WebP · 最大 20 MB</span><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="upload-preview" hidden alt="所选照片预览"><label class="field">场景名称<input id="scene-name" placeholder="为这个地方起个名字" maxlength="40"></label><div class="notice"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>这是界面原型。真实生成需进入现有工作台，并连接生成服务。</span></div><p id="upload-error" class="error" role="alert"></p><button class="button primary full" type="submit">预览生成流程 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></form><div class="tip"><b>什么照片更适合？</b><p>主体清晰、光线充足的风景照更容易理解。照片外的区域会由模型补全。</p></div></main><nav class="tabbar" aria-label="主导航"><a  href="home.html"><i class="fa-solid fa-images" aria-hidden="true"></i><span>照片</span></a><a aria-current=page href="upload.html"><i class="fa-solid fa-circle-plus" aria-hidden="true"></i><span>创建</span></a><a  href="library.html"><i class="fa-solid fa-bookmark" aria-hidden="true"></i><span>存档</span></a><a  href="settings.html"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>设置</span></a></nav><div class="home-indicator"></div><script src="app.js"></script></body></html>
